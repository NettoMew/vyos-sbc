# families/rockchip.conf — Rockchip 家族（RK3528 / RK3568 / RK3588·RK3582）的启动固件声明。
# 由 lib/env.sh 在 board.conf 之后 source（board.conf 写 BOARD_FAMILY="rockchip"）。
#
# 家族文件契约（lib/env.sh、lib/sources.sh、lib/uboot.sh、scripts/build.sh 只认这套名字，
# 引擎里没有任何家族 if；加一个 SoC 家族 = 加一个文件）：
#   变量  UBOOT_ARTIFACT           U-Boot 产物文件名（相对 U-Boot 源码树根）
#         UBOOT_IMAGE_OFFSET_KIB   image 阶段把产物 dd 到整盘的偏移（KiB）
#         KERNEL_DTB_FAMILY_GLOB   随版本目录附带的内核 DTB glob（相对 /usr/lib/linux-image-*/）
#   函数  family_soc_config <soc>  按 SoC 派生（未知 SoC 必须 fatal）
#         family_fetch_firmware    取固件源（sources 阶段，仅计划含 uboot 时调用）
#         family_firmware_inputs   往 stdout 打固件侧缓存输入（源 commit / blob 内容 / 平台）
#         family_firmware_prepare  选定或构建固件，填数组 FIRMWARE_MAKE_ARGS（U-Boot make 变量）
#         family_describe          一行摘要（构建计划打印）
#
# Rockchip：DDR init（TPL）与 BL31 用 rkbin 闭源 blob；产物 u-boot-rockchip.bin（TPL+BL31+U-Boot
# 整合镜像）写 32KiB（sector 64，与 alpine 项目同一套约定）。rkbin master 滚版本时会直接替换旧
# 文件，钉死文件名必碎 → 按 glob 取版本号最新的一个；RKBIN_BL31/RKBIN_TPL 可在 board.conf 显式
# 覆盖成 rkbin 内的相对路径。

UBOOT_ARTIFACT="u-boot-rockchip.bin"
UBOOT_IMAGE_OFFSET_KIB=32
KERNEL_DTB_FAMILY_GLOB="rockchip/rk35*.dtb"

family_soc_config() {
  case "$1" in
    rk3528)
      RKBIN_BL31_GLOB="${RKBIN_BL31_GLOB:-bin/rk35/rk3528_bl31_v*.elf}"
      RKBIN_TPL_GLOB="${RKBIN_TPL_GLOB:-bin/rk35/rk3528_ddr_1056MHz_v*.bin}"
      ;;
    rk3568)
      RKBIN_BL31_GLOB="${RKBIN_BL31_GLOB:-bin/rk35/rk3568_bl31_v*.elf}"
      RKBIN_TPL_GLOB="${RKBIN_TPL_GLOB:-bin/rk35/rk3568_ddr_1056MHz_v*.bin}"
      ;;
    rk3588)
      # RK3582（E52C）= RK3588S 残核 bin，boot 等同 rk3588s，用 rk3588 blob。
      # DDR 选 lp4_2112MHz/lp5_2400MHz（rkbin 同一 blob 覆盖 LPDDR4/4X/5、按板载颗粒
      # 自适应）；BL31 取版本最新。RKBIN_TPL 可在 board.conf 显式覆盖到其他频点。
      RKBIN_BL31_GLOB="${RKBIN_BL31_GLOB:-bin/rk35/rk3588_bl31_v*.elf}"
      RKBIN_TPL_GLOB="${RKBIN_TPL_GLOB:-bin/rk35/rk3588_ddr_lp4_2112MHz_lp5_2400MHz_v*.bin}"
      ;;
    *) fatal "rockchip 家族不认识 BOARD_SOC=$1（families/rockchip.conf 的 family_soc_config 加一条）" ;;
  esac
}

# 选 rkbin blob：显式覆盖（相对 rkbin 的路径）优先，否则按 glob 取版本最新。
rkbin_pick() {
  local override="$1" glob="$2"
  if [[ -n "${override}" ]]; then
    echo "${RKBIN_SRC}/${override}"
    return 0
  fi
  # shellcheck disable=SC2086
  ls -v ${RKBIN_SRC}/${glob} 2>/dev/null | tail -1
}

family_fetch_firmware() {
  git_clone_shallow "${RKBIN_REPO}" "${RKBIN_REF}" "${RKBIN_SRC}"
}

family_firmware_inputs() {
  local bl31 tpl
  bl31="$(rkbin_pick "${RKBIN_BL31:-}" "${RKBIN_BL31_GLOB}")" || return
  tpl="$(rkbin_pick "${RKBIN_TPL:-}" "${RKBIN_TPL_GLOB}")" || return
  git -C "${RKBIN_SRC}" rev-parse HEAD || return
  printf '%s\0' "${bl31}" "${tpl}"
  sha256sum "${bl31}" "${tpl}"
}

family_firmware_prepare() {
  local bl31 tpl
  bl31="$(rkbin_pick "${RKBIN_BL31:-}" "${RKBIN_BL31_GLOB}")"
  tpl="$(rkbin_pick "${RKBIN_TPL:-}" "${RKBIN_TPL_GLOB}")"
  [[ -f "${bl31}" ]] || [[ "${DRY_RUN:-0}" == "1" ]] \
    || fatal "BL31 缺失（glob: ${RKBIN_BL31_GLOB}）：${RKBIN_SRC}"
  [[ -f "${tpl}" ]] || [[ "${DRY_RUN:-0}" == "1" ]] \
    || fatal "DDR TPL 缺失（glob: ${RKBIN_TPL_GLOB}）：${RKBIN_SRC}"
  log "rkbin blob：$(basename "${tpl:-?}") + $(basename "${bl31:-?}")"
  FIRMWARE_MAKE_ARGS=(BL31="${bl31}" ROCKCHIP_TPL="${tpl}")
}

family_describe() {
  echo "rockchip / rkbin：${RKBIN_TPL:-${RKBIN_TPL_GLOB}} + ${RKBIN_BL31:-${RKBIN_BL31_GLOB}}"
}
