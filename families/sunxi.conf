# families/sunxi.conf — Allwinner 家族（sun55i = A523/A527/T527，Radxa Cubie A5E）的启动固件声明。
# 契约见 families/rockchip.conf 头注；board.conf 写 BOARD_FAMILY="sunxi"。
#
# Allwinner 无 rkbin 那样的 blob 仓库：
#   BL31  由 TF-A 源码现编（PLAT=<按 SoC>，见 family_soc_config）。上游 TF-A ≤ v2.15.0 的
#         plat/allwinner 只到 a133/a64/h6/h616/r329，没有 A523 → build.conf 钉 Armbian 同款
#         jernejsk 分支 a523-v4 的 commit；上游合入后改 TFA_REPO/TFA_REF 即可。
#         DEBUG=1 与 U-Boot 文档/Armbian 一致（串口多几行 BL31 日志，bring-up 期有用）。
#   DRAM  init 在 U-Boot SPL 自带（defconfig 里的 DRAM_SUNXI_* 时序），无 TPL blob。
#   SCP   无（crust 不支持 A523）→ SCP=/dev/null 让 binman 跳过。
#   产物  u-boot-sunxi-with-spl.bin（SPL+BL31+U-Boot 整合镜像）写 **128KiB**（sector 256）：
#         BROM 在 8KiB 与 128KiB 两处找 SPL，8KiB 会压坏 GPT 分区表项，GPT 盘必须用 128KiB
#         （U-Boot doc/board/allwinner/sunxi.rst）；SPL 按 BROM 报告的 MMC*_HIGH 启动源自动去
#         128KiB+ 找 U-Boot 本体（board/sunxi/board.c spl_mmc_get_uboot_raw_sector），SD 与
#         eMMC 同。Armbian 用 8KiB 是因为它默认 MBR，别照抄。

UBOOT_ARTIFACT="u-boot-sunxi-with-spl.bin"
UBOOT_IMAGE_OFFSET_KIB=128
KERNEL_DTB_FAMILY_GLOB="allwinner/sun55i*.dtb"

family_soc_config() {
  case "$1" in
    sun55i) TFA_PLAT="${TFA_PLAT:-sun55i_a523}" ;;
    *) fatal "sunxi 家族不认识 BOARD_SOC=$1（families/sunxi.conf 的 family_soc_config 加一条）" ;;
  esac
}

tfa_bl31_path() { echo "${TFA_SRC}/build/${TFA_PLAT}/debug/bl31.bin"; }

family_fetch_firmware() {
  git_clone_shallow "${TFA_REPO}" "${TFA_REF}" "${TFA_SRC}"
}

family_firmware_inputs() {
  git -C "${TFA_SRC}" rev-parse HEAD || return
  printf '%s\0' "${TFA_PLAT}"
}

# 全新 build/ 目录只编 bl31 目标（不需要 fiptool/openssl）。
family_firmware_prepare() {
  log "TF-A bl31（PLAT=${TFA_PLAT}，$(git -C "${TFA_SRC}" rev-parse --short HEAD 2>/dev/null || echo '?')）"
  run rm -rf "${TFA_SRC}/build" || return
  run make -C "${TFA_SRC}" -j"${JOBS}" CROSS_COMPILE=aarch64-linux-gnu- \
    PLAT="${TFA_PLAT}" DEBUG=1 bl31 || return
  [[ -f "$(tfa_bl31_path)" ]] || [[ "${DRY_RUN:-0}" == "1" ]] \
    || fatal "TF-A 构建结束但缺 $(tfa_bl31_path)"
  FIRMWARE_MAKE_ARGS=(BL31="$(tfa_bl31_path)" SCP=/dev/null)
}

family_describe() {
  echo "sunxi / TF-A bl31：PLAT=${TFA_PLAT} @ ${TFA_REF}"
}
