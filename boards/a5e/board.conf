# Radxa Cubie A5E（Allwinner A527 = sun55i，8×A55）— 双千兆路由：gmac0 + gmac1（两口都是
# SoC 内置 MAC + 外置 RGMII PHY，无 PCIe 网卡）。板载 Wi-Fi 使用 out-of-tree SDIO 驱动。本仓库第一块非 Rockchip
# 板：SoC 家族是声明文件 families/sunxi.conf（BOARD_FAMILY 指向它），其余全靠本文件声明 +
# boards/a5e/ 数据投放，引擎无板级/家族 if。
#
# U-Boot v2026.07 自带 radxa-cubie-a5e_defconfig（含 A523 DRAM 时序、AXP717、SPL
# LED），其 dts/upstream 里的 sun55i-a527-cubie-a5e.dts **已含 gmac0+gmac1**；内核 6.18.50 有
# 全部 A523 驱动（sun55i CCU/R-CCU/MCU-CCU、DT 驱动的新式 pinctrl、dwmac-sun8i(gmac0)、
# dwmac-sun55i(gmac1=GMAC200)、PCK-600 电源域、AXP717/AXP323 PMIC、sunxi-mmc），但其
# sun55i-a523.dtsi 尚无 gmac1 节点（6.19 才合入）。
#
# 与 Rockchip 家族的差异（全在这里 + 数据投放）：
#   ① BOARD_FAMILY=sunxi → families/sunxi.conf：BL31 走 TF-A 源码（PLAT=sun55i_a523，jernejsk
#      a523-v4，build.conf 钉 commit），产物 u-boot-sunxi-with-spl.bin，image 写 128KiB
#      （GPT 盘唯一安全偏移）；
#   ② 调试串口 uart0=ttyS0 @ **115200**（BROM/SPL/U-Boot/内核全链 115200，非 Rockchip 的
#      1500000）→ image.sh 把共享 default_config 的 speed 1500000 改成 115200；
#   ③ 内核片段 74-allwinner-sun55i.config 补 A523 全套启动件（=y，MMC 是根盘、PMIC 供 MMC 电）；
#   ④ 网口命名：在官方 vyos-net-name-resolve 的 ExecStartPre 中，按平台地址 + driver + DT MAC
#      只补默认 eth0/eth1 节点缺失的 hw-id；真正改名只由官方服务负责，保留用户已有绑定。
#      gmac0→eth0(WAN)、gmac1→eth1(LAN)，不再运行另一个 ifrename 服务互相抢名；
#   ⑤ 内核 DTS 补丁 boards/a5e/overlay/.../160-*.patch 把主线 6.19 的 gmac1（dtsi 节点 +
#      rgmii1 pinmux + 板级 &gmac1/&mdio1）backport 进 6.18.50 内核 DTB —— 默认**不**启用 DTB
#      override（见下），补丁只让 /boot/<ver>/dtbs/ 里那份内核 DTB 完整、并作为 override 的后手。
#   ⑥ U-Boot patches/always/ 修复 generic EHCI/OHCI OS 交接未停止 DMA：真机已把
#      udevadm 坏字节物理地址对应到旧 OHCI HCCA frame_no；usb stop 对照可登录。
#      同目录按参考镜像锁定的 Armbian commit 加入 DRAM 936MHz、CLDO3 和 MMC 启动修正。
#      0220 固件已真机启动 VyOS；保留 OHCI 交接修复，不能退回仅加 usb stop 的临时方案。
#   ⑦ PCIe：内核补丁 170–174 + 74 片段补 RC/ComboPHY/时钟；U-Boot 0050 同步 Linux DT 描述。
#      0060–0075 增加固件 PCIe/NVMe/SPI 与 DMA 交接、SPI 1.8V 供电及插槽电源时序；SD 恢复启动优先。
#      176/177 修正实时链路判断及 PERST#/电源交接；0545 SD/NVMe 读写、SPI-only 冷/热启动通过。
#      USB 保持 USB2（与 PCIe 共享高速通道）；175 同步备用内核 DT 的 SPI 供电保持策略。
BOARD_FAMILY="sunxi"
BOARD_SOC="sun55i"
BOARD_UBOOT_DEFCONFIG="radxa-cubie-a5e_defconfig"
BOARD_KERNEL_DTB="allwinner/sun55i-a527-cubie-a5e.dtb"
BOARD_IMAGE_PREFIX="radxa-cubie-a5e"
BOARD_SERIAL_CONSOLE="ttyS0"
BOARD_SERIAL_BAUD="115200"
BOARD_BIND_BOOT_MEDIA="1"  # SD/NVMe coexistence: squashfs and persistence stay on GRUB's disk.

# DTB override 关：U-Boot 2026.07 的控制 DTB 就是本板专属 DTS（radxa-cubie-a5e_defconfig
# → sun55i-a527-cubie-a5e），且比内核 6.18.50 的还新（含 gmac1）；更重要的是 U-Boot sunxi
# 启动时从 SID efuse 派生 MAC 并 fixup 进 ethernet0/ethernet1 alias（local-mac-address）
# → 两口 MAC 每启稳定，DHCP 租约不漂。若改用内核 DTB（override=1），这份 fixup 就丢了
# （随机 MAC，同 R5S/E52C 的坑）。仅当真机发现 U-Boot 控制 DTB 有问题时再置 1（此时内核 DTB
# 靠补丁 160 才带 gmac1）。
BOARD_DTB_OVERRIDE="0"

# AIC8800D80 SDIO Wi-Fi：内核 178/179 与 U-Boot 0076/0077 同步 mmc1、PL7 电源、
# PM1 reset 和 1.8V IO 电源。默认仍由固件 DT 交接，不牺牲稳定 Ethernet MAC。
# 外置驱动需与目标内核匹配的 Module.symvers 和签名密钥：使用 cross 构建。
BOARD_WIFI_AIC8800="1"
BOARD_AIC8800_FW_VARIANT="aic8800D80"
