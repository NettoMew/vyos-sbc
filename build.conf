# build.conf — 用户可调旋钮。所有项都可被环境变量覆盖：
#   VYOS_VERSION=1.5-test scripts/build.sh e20c

# --- VyOS 源 ------------------------------------------------------------------
# vyos-build 克隆来源。留空 = 自动探测：优先同级本地检出（秒级克隆），
# 否则回退到上游 GitHub。
VYOS_BUILD_REPO="${VYOS_BUILD_REPO:-}"
# 2026-09-14 rolling，配套 kernel_version=6.18.50。
VYOS_BUILD_REF="${VYOS_BUILD_REF:-22dfa15927f2bd01336ab2c0154800f061b0f2e8}"

# 烙进镜像的构建者标识（build-vyos-image --build-by）。
BUILD_BY="${BUILD_BY:-le4k@msn.com}"

# 镜像版本串。留空 = ISO 构建时生成 YYYY.MM.DD-HHMM-sbc。
VYOS_VERSION="${VYOS_VERSION:-}"

# 内核构建模式：container = 官方流程进 arm64 容器（默认，与官方环境零差异，慢）；
# cross = 宿主机交叉编译（快一个量级，产物同名同版本，不带 perf/headers 差异见
# lib/kernel.sh 头注）。改 DTS/补丁迭代用 cross：KERNEL_BUILD_MODE=cross REBUILD_KERNEL=1 make <板>
KERNEL_BUILD_MODE="${KERNEL_BUILD_MODE:-container}"

# --- 构建容器（arm64，经 qemu binfmt 仿真）------------------------------------
BUILDER_IMAGE="${BUILDER_IMAGE:-vyos-sbc/builder:rolling}"
BUILDER_PULL_IMAGE="${BUILDER_PULL_IMAGE:-vyos/vyos-build:current}"
BUILDER_PULL="${BUILDER_PULL:-0}"             # 默认从固定源码构建;自有带上下文标签的镜像可设 1

# --- U-Boot / Rockchip 固件 blob ----------------------------------------------
UBOOT_REPO="${UBOOT_REPO:-https://source.denx.de/u-boot/u-boot.git}"
UBOOT_REF="${UBOOT_REF:-ece349ade2973e220f524ce59e59711cc919263f}" # v2026.07
RKBIN_REPO="${RKBIN_REPO:-https://github.com/rockchip-linux/rkbin.git}"
RKBIN_REF="${RKBIN_REF:-3e288fe814e059dd06833495f845cab04ac20a5c}"

# --- Allwinner（sun55i / Cubie A5E）BL31：TF-A 源码交叉编 -----------------------
# 上游 TF-A（≤ v2.15.0）plat/allwinner 只有 a133/a64/h6/h616/r329，没有 A523；
# Armbian 的 sun55iw3 家族同样取 jernejsk 分支 a523-v4（"feat(allwinner): add A523
# support"，PLAT=sun55i_a523）。钉死该分支的 commit；上游合入后换回官方仓库即可。
# 仅 BOARD_FAMILY=sunxi 的板会拉取/编译（families/sunxi.conf 的 family_fetch_firmware / family_firmware_prepare）。
TFA_REPO="${TFA_REPO:-https://github.com/jernejsk/arm-trusted-firmware.git}"
TFA_REF="${TFA_REF:-e019f64d91ff7c2dfbbfe7f76a14f240761b9edc}"

# --- 镜像几何 ------------------------------------------------------------------
IMAGE_SIZE_GIB="${IMAGE_SIZE_GIB:-4}"         # 稀疏文件 + xz，大一点几乎不占空间
ESP_START_MIB="${ESP_START_MIB:-16}"          # ≥16：u-boot-rockchip.bin 占到 ~10MiB（sunxi 的 128KiB+~1MiB 更小）
ESP_SIZE_MIB="${ESP_SIZE_MIB:-256}"
XZ_LEVEL="${XZ_LEVEL:-6}"                   # 整盘 .img.xz（可直接交给 Etcher）
KEEP_RAW_IMAGE="${KEEP_RAW_IMAGE:-0}"         # 1 = 压缩后保留未压缩 .img

JOBS="${JOBS:-$(nproc)}"
